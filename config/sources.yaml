# 数据源优先级（R5-P2-01：collector/adapters/sources.py 消费此配置）
# primary 失败时按 fallback 顺序降级；口径差异由各模块适配层归一化。

market:
  primary: eastmoney
  fallback:
    - eastmoney_delay
    - tencent
    - sina

# 全市场 spot（涨跌家数）：东财 push2 主机被封时降级新浪（delay 主机 clist
# 实测后端节点数据不一致，total 在 1640~59070 间漂移，不可用于全市场统计）
spot:
  primary: eastmoney
  fallback:
    - sina

# 两市成交额：spot 源仅当日；exchange 为交易所官方文件源，支持历史回查
turnover:
  primary: eastmoney
  fallback:
    - exchange
    - sina

# 板块行情：东财 → 同花顺 THS（口径以 method 字段区分，不混装历史）
sector:
  primary: eastmoney
  fallback:
    - ths

# 主力资金流：东财 → 同花顺 THS（仅当日快照，无免费历史）
fundflow:
  primary: eastmoney
  fallback:
    - ths

northbound:
  primary: hkex

margin:
  primary:
    - sse
    - szse
