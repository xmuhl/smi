  石油石化:
    aliases: [石油石化, 石油, 石化]
    positioning: 能源权重/防御
    coreCatalyst: 油价高位震荡、能源安全与央企市值管理催化
    earningsRealization: 上游油气盈利兑现强，中游炼化承压
  电力:
    aliases: [电力, 电力行业, 公用事业]
    positioning: 公用事业/高股息
    coreCatalyst: 夏季用电高峰、电力市场化与电改政策催化
    earningsRealization: 业绩确定性强、电价上浮，经营现金流稳健
  医药生物:
    aliases: [医药生物, 医药, 生物制品, 医疗行业]
    positioning: 防御+成长
    coreCatalyst: 创新药出海授权加速、CXO订单边际改善、集采利空出清
    earningsRealization: 业绩有望触底回升，出海与放量品种兑现确定性待验证
  半导体:
    aliases: [半导体, 电子半导体]
