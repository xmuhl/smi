# 赛道配置 v3.0（R12-PLAN-2：固定清单 → 动态选池 + 板块元数据库）
#
# 结构分三层：
# 1. selection —— 动态候选池参数：每日从 industry-universe-snapshot 归档
#    按全市场口径选出当日候选（参照范本《A股收盘全景》第 8 表）：
#    近 N 日成交额排名靠前 + 当日主力净流入为正 → 前 poolSize 名为候选；
# 2. boardMetadata —— 板块元数据库：按 THS 行业名（aliases 支持别名）
#    提供定位/催化/业绩定性文案；未配置的动态候选定性留空（fail-closed，
#    计入指标缺口，绝不伪造）；定性文案随 configVersion 版本化，
#    采集器写快照时携带 configVersion/effectiveFrom/To；
# 3. tracks —— 种子赛道（上线基线，含概念/复合结构）。种子仍每日参与
#    统一评分与四级判定（无特权），并保持板块代码/THS 映射的准确性。
#
# index_name_ths：同花顺板块指数接口（stock_board_industry/concept_index_ths）
# 使用的精确板块名——与东财板块名/代码不一一对应，必须显式映射；缺失则该
# 赛道归档 UNAVAILABLE（fail-closed，不伪造）。

configVersion: "3.2"
effectiveFrom: "2026-08-20"
effectiveTo: "2026-12-31"

selection:
  # 候选池大小：范本硬阈值"近5日成交额全市场前5"用于核心判定，
  # 池取 8 以覆盖边缘分级并保持连续观察
  poolSize: 8
  # 近 N 日成交额窗口（范本口径 5 日）
  amountWindowDays: 5
  # 候选必须当日主力净流入为正（范本资金维度硬阈值）
  requirePositiveInflow: true
  # R13-P2-01 入/出池迟滞（防单日资金翻正/翻负或排名 8/9 抖动反复进出池）：
  # - 准入：近 entryWindowDays 个 universe 归档日内至少 entryMinDays 日满足
  #   "成交额排名<=poolSize 且当日净流入>0"才入池（归档历史不足时按实际
  #   天数收敛，冷启动退化为单日规则）；
  # - 退出：连续 exitConfirmDays 日触及出池条件（排名>exitRankMax 或净流
  #   入非正或当日缺行）才出池——双阈值分离（入 8 / 出 12）；
  entryWindowDays: 3
  entryMinDays: 2
  exitRankMax: 12
  exitConfirmDays: 2
  # R13-P2-01 预热池：成交额排名前 prewarmRankMax 的板块由 archive-raw
  # 持续回补 close 历史（不要求当日净流入为正），消除"首次入选次日才开始
  # 累积历史"的冷启动；预热数据不直接提升评分。
  prewarmRankMax: 16
  # 历史就绪门禁（R15 起为真门禁）：动态候选 close 历史 < minHistoryDays
  # 个交易日记为 dataReadiness=WARMING_UP——预热候选不参与正式评分
  #（score=null、decision=数据不足）、不计入模块 coverage 分母与 D0；
  # MA20/20 日窗口类指标的最低就绪线。
  minHistoryDays: 20
  # universe 最低完整性门禁（R14 §5.4）：当日 universe 板块行数
  # >= max(minUniverseBoards, 全历史单日峰值 * minUniverseBoardRatio) 才
  # 视为完整证据日；不完整日不驱动出池 streak、不提供入池命中——
  # 防止上游部分响应被误解释为市场资格失败（缺行=exit hit 的前置）。
  minUniverseBoardRatio: 0.5
  minUniverseBoards: 0

