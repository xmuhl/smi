    coreCatalyst: 迎峰度夏补库、煤价韧性，高股息防御属性
    earningsRealization: 长协占比高、盈利稳定，分红率维持高位
  证券:
    aliases: [证券, 券商]
    positioning: 金融beta
    coreCatalyst: 资本市场活跃度提升、并购重组政策催化
    earningsRealization: 经纪与自营收入随市波动，兑现弹性大但确定性弱
  有色金属:
    aliases: [有色金属, 有色]
    positioning: 资源周期
    coreCatalyst: 全球降息预期与供给约束推升金属价格
    earningsRealization: 资源价格上行周期盈利兑现强

tracks:
  - id: dividend_cnsoe
    name: 高股息中特估
    enabled: true
    # R23-P2-03 跨 taxonomy 可比资格：概念腿以 THS 概念指数逐日成交额
    #（元，注入时换算为亿）插入行业 universe 联合排名；净流入/涨跌家数
    # 为概念口径诚实缺口（不参与资格判定，仅评分层缺口计）
    qualification:
      taxonomy: concept
    board_type: concept
    # R23-P2-03：THS 概念代码（原 BK1139 旧源序列去重键随之失效，
    # archive_raw 按同花顺中特估100 重补同源同单位序列用于联合排名）
    board_code: "309062"
    expected_name: 中特估
    index_name_ths: 同花顺中特估100
    positioning: 高股息/央国企价值
    coreCatalyst: 高股息防御属性、资金抱团避险，央国企市值管理政策催化
    earningsRealization: 业绩稳定、分红率高，盈利兑现确定性强

  - id: power
    name: 电力
    qualification:
      taxonomy: industry
    enabled: true
    board_type: industry
    board_code: BK0428
    expected_name: 电力
    index_name_ths: 电力
    positioning: 公用事业/高股息
    coreCatalyst: 夏季用电高峰、电力市场化与电改政策催化
    earningsRealization: 业绩确定性强、电价上浮，经营现金流稳健

  - id: healthcare
