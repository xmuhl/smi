# 赛道配置 v3.0（R12-PLAN-2：固定清单 → 动态选池 + 板块元数据库）
#
# 结构分三层：
# 1. selection —— 动态候选池参数：每日从 industry-universe-snapshot 归档
#    按监测口径（行业板块全景+已配置概念赛道联合排名）选出当日候选
#    （参照范本《A股收盘全景》第 8 表；R24-P3-02：不自称"全市场"）：
#    近 N 日成交额排名靠前 + 当日主力净流入为正 → 前 poolSize 名为候选；
# 2. boardMetadata —— 板块元数据库：按 THS 行业名（aliases 支持别名）
#    提供定位/催化/业绩定性文案；未配置的动态候选定性留空（fail-closed，
#    计入指标缺口，绝不伪造）；定性文案随 configVersion 版本化，
#    采集器写快照时携带 configVersion/effectiveFrom/To；
# 3. tracks —— 种子赛道（上线基线，含概念/复合结构）。R22-DEF-01 起
#    种子映射 universe 板块名后并入入池/出池状态机（承继初始资格、
#    仅按排名口径出池），不再无条件在场；无 universe 数据日输出空池。
#
# index_name_ths：同花顺板块指数接口（stock_board_industry/concept_index_ths）
# 使用的精确板块名——与东财板块名/代码不一一对应，必须显式映射；缺失则该
# 赛道归档 UNAVAILABLE（fail-closed，不伪造）。

configVersion: "3.5"
effectiveFrom: "2026-07-20"
effectiveTo: "2026-12-31"

selection:
  # R23-P2-01/P2-02（范本严格口径修订）：
  # - 准入：近5日成交额监测口径排名 <= entryRankMax（=5，范本硬阈值），
  #   仅排名条件——净流入不作准入硬门（排名决定监测资格，资金流决定
  #   评分/评级；R22-P2-02 裁定净流出硬门系统性漏选负流入高活跃板块）；
  # - 两层资格：QUALIFIED_TODAY（rank<=5 当日范本资格）与
  #   RETAINED_OBSERVATION（曾入选、rank∈(5,exitRankMax]、未满出池确认
  #   的迟滞观察保留）为独立资格层，输出/前端显式分层，不得等价呈现；
  # - 退出：连续 exitConfirmDays 日排名 > exitRankMax（或当日缺行）。
  entryRankMax: 5
  # 近 N 日成交额窗口（范本口径 5 日）
  amountWindowDays: 5
  # R24（R22-P2-01 收口）：当日前5直接入池（每日范本真理源），无多日
  # 确认门槛；防抖完全由出池确认承担。entryWindowDays/entryMinDays
  # 的 2/3 入池确认语义已退役（保留键仅为配置兼容诊断）。
  entryWindowDays: 3
  entryMinDays: 2
  exitRankMax: 12
  exitConfirmDays: 2
  # R13-P2-01 预热池：成交额排名前 prewarmRankMax 的板块由 archive-raw
  # 持续回补 close 历史（不要求当日净流入为正），消除"首次入选次日才开始
  # 累积历史"的冷启动；预热数据不直接提升评分。
  prewarmRankMax: 16
  # 历史就绪门禁（R15 起为真门禁）：动态候选 close 历史 < minHistoryDays
  # 个交易日记为 dataReadiness=WARMING_UP——预热候选不参与正式评分
  #（score=null、decision=数据不足）、不计入模块 coverage 分母与 D0；
  # MA20/20 日窗口类指标的最低就绪线。
  minHistoryDays: 20
  # universe 最低完整性门禁（R14 §5.4，R15 评审因果化修订）：证据日
  # 判定只依赖严格早于当日的可信前向峰值（只有完整日抬高基线；未来
  # 更高峰值不回溯改写历史证据资格）；绝对下限来自已验证完整快照——
  # 2026-08-20 实测 THS universe 90 板块，取其半。不完整日不驱动出池
  # streak、不提供入池命中（缺行=exit hit 的前置是当日 universe 已
  # 通过完整性校验）。
  minUniverseBoardRatio: 0.5
  minUniverseBoards: 45

