name: archive-raw

on:
  schedule:
    # 08:35 UTC = 16:35 Asia/Shanghai（工作日，close-snapshot 之后）
    - cron: "35 8 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "目标交易日 YYYY-MM-DD（留空自动）"
        required: false
        default: "auto"
        type: string
      deploy:
        description: "无数据变化也强制构建并部署（deploy 失败恢复用）"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  # 必须与 close-snapshot 等一切数据写入 workflow 共用同一 group（串行化 git 写）
  group: smi-data-write-${{ github.ref }}
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r collector/requirements.txt

      - name: Python syntax preflight
        run: |
          python -m compileall -q collector

      - name: Run raw archive
        id: archive
        env:
          SMI_WORKFLOW: archive-raw
          TARGET_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.date || 'auto' }}
        run: |
          set +e
          python -m collector.jobs.archive_raw --date "$TARGET_DATE"
          rc=$?
          set -e

          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"

          # 暂不在这里终止 job：
          # 后续先根据真实 rc 执行发布门禁，最后再传播原始失败码。
          exit 0

      - name: Commit data if changed
        id: commit
        # 只有 archive transaction 完整返回 0 才允许进入 Git 外部副作用。
        # rc=2 可能来自 replace 后 parent-fsync/readback 阶段，
        # canonical 可能已变化但尚未被证明安全，必须 fail-closed。
        # [REVERT:GLM F3 的"任何失败都 !cancelled() 提交"——exit 2 不保证
        #  archive 工作树全部可信；部分 FETCH_FAILED 但 written>0 仍返回 0，
        #  合法部分结果照常提交]
        if: ${{ !cancelled() && steps.archive.outputs.exit_code == '0' }}
        env:
          TARGET_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.date || 'auto' }}
        run: |
          git config user.name "smi-bot"
          git config user.email "smi-bot@users.noreply.github.com"

          # 只 stage *.jsonl（契约：git add 仅纳入 JSONL 归档；
          # 其他文件即使出现也不会被提交）
          if [ -d web/public/data/archive ]; then
            find web/public/data/archive \
              -maxdepth 1 \
              -type f \
              -name '*.jsonl' \
              -print0 \
              | xargs -0 -r git add --
          fi

          if git diff --cached --quiet; then
            echo "NO_CHANGE"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "data: raw archive $TARGET_DATE"

          for attempt in 1 2 3; do
            if git push; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git pull --rebase || exit 1
          done

          echo "PUSH_FAILED"
          exit 1

      - name: Propagate archive failure
        # 必须位于任何 build/deploy 前：
        # rc=1/2 时先把 job 置为失败，禁止"先部署、后报红"。
        if: ${{ !cancelled() && steps.archive.outputs.exit_code != '0' }}
        run: |
          echo "archive_raw failed with exit code ${{ steps.archive.outputs.exit_code }}"
          exit "${{ steps.archive.outputs.exit_code }}"

      - name: Setup Node
        if: ${{ steps.archive.outputs.exit_code == '0' && (steps.commit.outputs.changed == 'true' || inputs.deploy) }}
        uses: actions/setup-node@v4
        with:
          # wrangler 4.122.0 要求 Node >= 22（R12-FIX-1）
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        if: ${{ steps.archive.outputs.exit_code == '0' && (steps.commit.outputs.changed == 'true' || inputs.deploy) }}
        working-directory: web
        run: npm ci

      - name: Type check
        if: ${{ steps.archive.outputs.exit_code == '0' && (steps.commit.outputs.changed == 'true' || inputs.deploy) }}
        working-directory: web
        run: npm run typecheck

      - name: Build
        if: ${{ steps.archive.outputs.exit_code == '0' && (steps.commit.outputs.changed == 'true' || inputs.deploy) }}
        working-directory: web
        run: npm run build

      - name: Deploy to Cloudflare Pages
        if: ${{ steps.archive.outputs.exit_code == '0' && (steps.commit.outputs.changed == 'true' || inputs.deploy) }}
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy dist             --project-name smi             --branch main             --commit-dirty=true

      # R12-FIX-4（复核修订）：archive-raw 不改写 latest.json，原 updatedAt
      # R13-P3-04：发布自检升级为「必需集合完备 + 内容一致」。
      # 必需/可选集合显式声明（不静默 continue）：
      # - 必需 4 类：日常归档链路稳定产出，本地缺失或线上不一致即 FAIL；
      # - 可选 1 类：track-membership-snapshot 为产品裁决的诚实缺口
      #   （membership 仅当日可采，历史回补不可得），存在则必须一致，
      #   缺失只告警不失败。
      - name: Verify deployment freshness
        if: ${{ steps.archive.outputs.exit_code == '0' && (steps.commit.outputs.changed == 'true' || inputs.deploy) }}
        run: |
          set -euo pipefail

          BASE="https://smi-6s2.pages.dev/data/archive"
          REQUIRED_FILES="track-board-close track-board-flow limit-up-pool industry-universe-snapshot"
          OPTIONAL_FILES="track-membership-snapshot"

          ok=1
          required=0
          checked=0

          check_one() {
            local f="$1"
            local required_flag="$2"
            local LOCAL="web/dist/data/archive/$f.jsonl"

            if [ ! -s "$LOCAL" ]; then
              if [ "$required_flag" = "required" ]; then
                echo "REQUIRED_LOCAL_ARCHIVE_MISSING_OR_EMPTY: $LOCAL"
                ok=0
              else
                echo "OPTIONAL_LOCAL_ARCHIVE_MISSING: $LOCAL (warning only)"
              fi
              return
            fi

            checked=$((checked + 1))
            local LOCAL_SHA256
            LOCAL_SHA256="$(sha256sum "$LOCAL" | cut -d' ' -f1)"

            local matched=0
            for attempt in 1 2 3 4 5 6; do
              sleep 20

              local REMOTE="/tmp/smi-$f.jsonl"
              rm -f "$REMOTE"

              if ! curl -fsS --max-time 20                 -H 'Cache-Control: no-cache'                 "$BASE/$f.jsonl"                 -o "$REMOTE"; then
                echo "attempt=$attempt $f unreachable"
                continue
              fi

              local SITE_SHA256
              SITE_SHA256="$(sha256sum "$REMOTE" | cut -d' ' -f1)"

              if [ "$SITE_SHA256" = "$LOCAL_SHA256" ]; then
                echo "MATCH $f.jsonl sha256=$SITE_SHA256"
                matched=1
                break
              fi

              echo "attempt=$attempt $f mismatch (local=$LOCAL_SHA256 site=$SITE_SHA256)"
            done

            if [ "$matched" != "1" ]; then
              if [ "$required_flag" = "required" ]; then
                ok=0
              else
                echo "OPTIONAL_ARCHIVE_MISMATCH: $f.jsonl (warning only)"
              fi
            fi
          }

          for f in $REQUIRED_FILES; do
            required=$((required + 1))
            check_one "$f" required
          done
          for f in $OPTIONAL_FILES; do
            check_one "$f" optional
          done

          if [ "$checked" -lt "$required" ]; then
            echo "LOCAL_ARCHIVE_SET_INCOMPLETE: checked=$checked required=$required"
            ok=0
          fi

          if [ "$ok" != "1" ]; then
            echo "SITE_ARCHIVE_INCOMPLETE_OR_MISMATCH"
            exit 1
          fi

          echo "SITE_ARCHIVE_EXACT_MATCH"
