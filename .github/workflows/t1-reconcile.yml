name: t1-reconcile

on:
  # 2026-09-02（VPS 迁移任务 9 · GitHub schedule 退役，回滚见 close-snapshot.yml 注释；
  # runner 海外 IP 被交易所重置的结构性劣势由 VPS 国内直连根治）
  # schedule:
  #   # 10:17 / 18:17 / 20:17 CST（UTC+8）。第三窗口（P0-b，2026-08-25）
  #   # 为交易所源对 runner 海外 IP 的连接重置留出额外重试时段。
  #   - cron: "17 2 * * 1-5"
  #   - cron: "17 9 * * 1-5"
  #   - cron: "17 12 * * 1-5"
  workflow_dispatch:
    inputs:
      deploy:
        description: "无数据变化也强制构建并部署（deploy 失败恢复用）"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: smi-data-write-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record job start (UTC)
        run: echo "JOB_START_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r collector/requirements.txt

      - name: Python syntax preflight
        run: |
          python -m compileall -q collector

      - name: Run T+1 reconcile
        env:
          SMI_WORKFLOW: t1-reconcile
        run: |
          python -m collector.jobs.t1_reconcile \
            --date auto

      - name: Commit data if changed
        id: commit
        run: |
          git config user.name "smi-bot"
          git config user.email "smi-bot@users.noreply.github.com"

          git add web/public/data

          if git diff --cached --quiet; then
            echo "NO_CHANGE"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "data: t1 reconcile"
          git pull --rebase
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # ===== 方案 A：数据变化才构建并发布 =====
      - name: Setup Node
        if: steps.commit.outputs.changed == 'true' || inputs.deploy
        uses: actions/setup-node@v4
        with:
          # wrangler 4.122.0 要求 Node >= 22（R12-FIX-1）
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        if: steps.commit.outputs.changed == 'true' || inputs.deploy
        working-directory: web
        run: npm ci

      - name: Type check
        if: steps.commit.outputs.changed == 'true' || inputs.deploy
        working-directory: web
        run: npm run typecheck

      - name: Build
        if: steps.commit.outputs.changed == 'true' || inputs.deploy
        working-directory: web
        run: npm run build

      - name: Deploy to Cloudflare Pages
        if: steps.commit.outputs.changed == 'true' || inputs.deploy
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy dist \
            --project-name smi \
            --branch main \
            --commit-dirty=true

      # R12-FIX-4：部署后自检（口径同 close-snapshot）
      - name: Verify deployment freshness
        # 复核修订：NO_CHANGE/强制部署时 latest.json 不更新，避免假失败；
        # 仅数据变化（changed=true）的发布才做新鲜度断言
        if: steps.commit.outputs.changed == 'true'
        run: |
          SITE="https://smi-6s2.pages.dev/data/latest.json"
          for attempt in 1 2 3 4 5 6; do
            sleep 30
            META=$(curl -fsS --max-time 20 "$SITE" 2>/dev/null | python3 -c '
          import json, sys
          try:
            d = json.load(sys.stdin)
          except Exception:
            print("")
            raise SystemExit(0)
          print(d.get("updatedAt", "") + "|" + str(d.get("tradeDate", "")))
          ' || echo "")
            UPDATED=$(printf '%s' "$META" | cut -d"|" -f1)
            TRADE_DATE=$(printf '%s' "$META" | cut -d"|" -f2)
            if [ -n "$UPDATED" ]; then
              VERDICT=$(python3 -c '
          import sys
          from datetime import datetime
          def parse(s):
            s = s.strip().replace("Z", "+00:00")
            return datetime.fromisoformat(s)
          print("FRESH" if parse(sys.argv[1]) >= parse(sys.argv[2]) else "STALE")
          ' "$UPDATED" "$JOB_START_UTC")
              echo "attempt=$attempt tradeDate=$TRADE_DATE updatedAt=$UPDATED verdict=$VERDICT"
              if [ "$VERDICT" = "FRESH" ]; then
                echo "SITE_FRESH"
                exit 0
              fi
            else
              echo "attempt=$attempt site unreachable or unparsable"
            fi
          done
          echo "SITE_STALE_OR_UNREACHABLE after deploy"
          exit 1

      # P0-b（2026-08-25）：两融硬门禁 + 告警。此前补数失败一律退出 0
      # （绿皮红心），margin 连续 ERROR 两天无人察觉（08-21/08-24 事故）。
      # margin=ERROR 属源失败硬缺口 → 红灯 + 飞书；STALE（交易所未披露）
      # 仅 warning。FEISHU_WEBHOOK_URL 未配置时降级为 annotation + 邮件。
      - name: Margin health gate & alert
        if: always()
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python tools/alert/data_health.py \
            --mode t1-reconcile
