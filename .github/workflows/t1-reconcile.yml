name: t1-reconcile

on:
  schedule:
    - cron: "17 2 * * 1-5"
    - cron: "17 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smi-data-write-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r collector/requirements.txt

      - name: Python syntax preflight
        run: |
          python -m compileall -q collector

      - name: Run T+1 reconcile
        env:
          SMI_WORKFLOW: t1-reconcile
        run: |
          python -m collector.jobs.t1_reconcile \
            --date auto

      - name: Commit data if changed
        id: commit
        run: |
          git config user.name "smi-bot"
          git config user.email "smi-bot@users.noreply.github.com"

          git add web/public/data

          if git diff --cached --quiet; then
            echo "NO_CHANGE"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "data: t1 reconcile"
          git pull --rebase
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # ===== 方案 A：数据变化才构建并发布 =====
      - name: Setup Node
        if: steps.commit.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        if: steps.commit.outputs.changed == 'true'
        working-directory: web
        run: npm ci

      - name: Type check
        if: steps.commit.outputs.changed == 'true'
        working-directory: web
        run: npm run typecheck

      - name: Build
        if: steps.commit.outputs.changed == 'true'
        working-directory: web
        run: npm run build

      - name: Deploy to Cloudflare Pages
        if: steps.commit.outputs.changed == 'true'
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy dist \
            --project-name smi \
            --branch main \
            --commit-dirty=true
