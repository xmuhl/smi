name: close-snapshot

on:
  schedule:
    - cron: "23 8 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "目标交易日 YYYY-MM-DD（留空自动）"
        required: false
        default: "auto"
        type: string
      deploy:
        description: "无数据变化也强制构建并部署（deploy 失败恢复用）"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: smi-data-write-${{ github.ref }}
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r collector/requirements.txt

      - name: Python syntax preflight
        run: |
          python -m compileall -q collector

      - name: Run close snapshot
        env:
          SMI_WORKFLOW: close-snapshot
          TARGET_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.date || 'auto' }}
        run: |
          python -m collector.jobs.close_snapshot             --date "$TARGET_DATE"

      - name: Commit data if changed
        id: commit
        env:
          TARGET_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.date || 'auto' }}
        run: |
          git config user.name "smi-bot"
          git config user.email "smi-bot@users.noreply.github.com"

          git add web/public/data

          if git diff --cached --quiet; then
            echo "NO_CHANGE"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "data: close snapshot $TARGET_DATE"
          git pull --rebase
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # ===== 方案 A：数据变化才构建并发布到 Cloudflare Pages =====
      - name: Setup Node
        if: steps.commit.outputs.changed == 'true' || inputs.deploy
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        if: steps.commit.outputs.changed == 'true' || inputs.deploy
        working-directory: web
        run: npm ci

      - name: Type check
        if: steps.commit.outputs.changed == 'true' || inputs.deploy
        working-directory: web
        run: npm run typecheck

      - name: Build
        if: steps.commit.outputs.changed == 'true' || inputs.deploy
        working-directory: web
        run: npm run build

      - name: Deploy to Cloudflare Pages
        if: steps.commit.outputs.changed == 'true' || inputs.deploy
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy dist             --project-name smi             --branch main             --commit-dirty=true
