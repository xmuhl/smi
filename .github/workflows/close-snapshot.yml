name: close-snapshot

on:
  schedule:
    # P0-a（2026-08-25）：16:23 主窗口 + 18:23/19:23 自愈窗口（CST=UTC+8）。
    # 当日 spot 源（东财/新浪）整窗被封时，主窗口 fail-closed 拦截发布；
    # 后续窗口在新时段重试。已发布日由 freshness 守卫秒级跳过，零成本。
    - cron: "23 8 * * 1-5"
    - cron: "23 10 * * 1-5"
    - cron: "23 11 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "目标交易日 YYYY-MM-DD（留空自动）"
        required: false
        default: "auto"
        type: string
      deploy:
        description: "无数据变化也强制构建并部署（deploy 失败恢复用）"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: smi-data-write-${{ github.ref }}
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Record job start (UTC)
        run: echo "JOB_START_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      # P0-a：自愈窗口的零成本守卫——当日 daily 文件已存在（任一状态）
      # 即跳过采集。仅对 schedule 生效；手动 dispatch 永不跳过（恢复路径）。
      # 只看存在性不看状态：已发布日的模块级改善属于回补语义
      # （manual-backfill 有合并保护），不能由无保护的整日重采集承担。
      - name: Skip if today already published (schedule only)
        id: freshness
        if: github.event_name == 'schedule'
        run: |
          TODAY="$(TZ=Asia/Shanghai date +%F)"
          YEAR="${TODAY%%-*}"
          if [ -f "web/public/data/daily/${YEAR}/${TODAY}.json" ]; then
            echo "SKIP_ALREADY_PUBLISHED ${TODAY}"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "PENDING_PUBLISH ${TODAY}"
          fi

      - name: Install Python dependencies
        if: steps.freshness.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r collector/requirements.txt

      - name: Python syntax preflight
        if: steps.freshness.outputs.skip != 'true'
        run: |
          python -m compileall -q collector

      - name: Run close snapshot
        id: snapshot
        if: steps.freshness.outputs.skip != 'true'
        # 2026-08-28：exit 3（BEFORE_CLOSE 盘前良性跳过）在 shell 内转
        # exit 0——GitHub 调度劣化时 cron 补发延迟 7~10h（08-27 事故
        # 实测），凌晨执行 auto 解析到未收盘日属预期跳过，不应红灯；
        # exit 2（VALIDATION_FAILED 采集失败/门禁拦截）原样透传保留
        # job 级红灯（步骤失败 + data_health 双保险，含 dispatch 重采
        # 已发布日场景）。下游按 exitcode 输出门控。
        env:
          SMI_WORKFLOW: close-snapshot
          TARGET_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.date || 'auto' }}
        run: |
          set +e
          python -m collector.jobs.close_snapshot             --date "$TARGET_DATE"
          rc=$?
          set -e
          echo "exitcode=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -eq 3 ]; then exit 0; fi
          exit $rc

      - name: Commit data if changed
        if: steps.freshness.outputs.skip != 'true' && steps.snapshot.outputs.exitcode == '0'
        id: commit
        env:
          TARGET_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.date || 'auto' }}
        run: |
          git config user.name "smi-bot"
          git config user.email "smi-bot@users.noreply.github.com"

          git add web/public/data

          if git diff --cached --quiet; then
            echo "NO_CHANGE"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "data: close snapshot $TARGET_DATE"
          git pull --rebase
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # ===== 方案 A：数据变化才构建并发布到 Cloudflare Pages =====
      - name: Setup Node
        if: (steps.commit.outputs.changed == 'true' || inputs.deploy) && steps.snapshot.outputs.exitcode == '0'
        uses: actions/setup-node@v4
        with:
          # wrangler 4.122.0 要求 Node >= 22（R12-FIX-1：Node 20 曾导致
          # 每次 Deploy 步骤失败、站点数据停留在旧日期）
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        if: (steps.commit.outputs.changed == 'true' || inputs.deploy) && steps.snapshot.outputs.exitcode == '0'
        working-directory: web
        run: npm ci

      - name: Type check
        if: (steps.commit.outputs.changed == 'true' || inputs.deploy) && steps.snapshot.outputs.exitcode == '0'
        working-directory: web
        run: npm run typecheck

      - name: Build
        if: (steps.commit.outputs.changed == 'true' || inputs.deploy) && steps.snapshot.outputs.exitcode == '0'
        working-directory: web
        run: npm run build

      - name: Deploy to Cloudflare Pages
        if: (steps.commit.outputs.changed == 'true' || inputs.deploy) && steps.snapshot.outputs.exitcode == '0'
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy dist             --project-name smi             --branch main             --commit-dirty=true

      # R12-FIX-4：部署后自检——线上 latest.json 的 updatedAt 必须晚于本次
      # job 启动时刻，否则视为发布未生效（fail-closed 触发 GitHub 失败通知）。
      # R13-P3-03：部署自检升级为内容身份校验——线上 latest.json 必须与
      # 本次构建产物 web/dist/data/latest.json 的 SHA-256 完全一致（同时覆盖
      # tradeDate/revision/updatedAt/modules），不再用时间新鲜度代替身份。
      - name: Verify deployment freshness
        # 复核修订：NO_CHANGE/强制部署时 latest.json 不更新，避免假失败；
        # 仅数据变化（changed=true）的发布才做身份断言
        if: steps.commit.outputs.changed == 'true'
        run: |
          set -euo pipefail

          SITE="https://smi-6s2.pages.dev/data/latest.json"
          LOCAL="web/dist/data/latest.json"
          REMOTE="/tmp/smi-site-latest.json"

          if [ ! -s "$LOCAL" ]; then
            echo "LOCAL_LATEST_MISSING_OR_EMPTY: $LOCAL"
            exit 1
          fi

          LOCAL_SHA256="$(sha256sum "$LOCAL" | cut -d' ' -f1)"
          LOCAL_TRADE_DATE="$(
            python3 -c '
          import json, sys
          with open(sys.argv[1], "r", encoding="utf-8") as fh:
              data = json.load(fh)
          print(data.get("tradeDate", ""))
          ' "$LOCAL"
          )"

          if [ -z "$LOCAL_TRADE_DATE" ]; then
            echo "LOCAL_LATEST_TRADE_DATE_MISSING"
            exit 1
          fi

          for attempt in 1 2 3 4 5 6; do
            sleep 30
            rm -f "$REMOTE"

            if ! curl -fsS --max-time 20               -H 'Cache-Control: no-cache'               "$SITE"               -o "$REMOTE"; then
              echo "attempt=$attempt site unreachable"
              continue
            fi

            SITE_SHA256="$(sha256sum "$REMOTE" | cut -d' ' -f1)"
            SITE_TRADE_DATE="$(
              python3 -c '
          import json, sys
          try:
              with open(sys.argv[1], "r", encoding="utf-8") as fh:
                  data = json.load(fh)
          except Exception:
              print("")
              raise SystemExit(0)
          print(data.get("tradeDate", ""))
          ' "$REMOTE"
            )"

            echo               "attempt=$attempt"               "localTradeDate=$LOCAL_TRADE_DATE"               "siteTradeDate=$SITE_TRADE_DATE"               "localSha256=$LOCAL_SHA256"               "siteSha256=$SITE_SHA256"

            if [ "$SITE_TRADE_DATE" = "$LOCAL_TRADE_DATE" ] &&                [ "$SITE_SHA256" = "$LOCAL_SHA256" ]; then
              echo "SITE_LATEST_EXACT_MATCH"
              exit 0
            fi
          done

          echo "SITE_LATEST_MISMATCH_OR_UNREACHABLE after deploy"
          exit 1

      # P0-b：数据健康门禁 + 告警（if: always()——前序失败时仍执行；
      # freshness 跳过路径除外：该路径未安装 Python 依赖且 16:23 主窗口
      # 已做过健康检查，重复检查只会误红）。
      # 当日快照缺失（采集失败/门禁拦截）或 margin ERROR → 红灯 + 飞书；
      # 其余模块缺口 → warning annotation。FEISHU_WEBHOOK_URL 未配置时
      # 降级为 annotation + GitHub 邮件，不阻塞。
      # 2026-08-28：exit 3（BEFORE_CLOSE 盘前良性跳过）不告警——调度延迟
      # 补发在凌晨执行属预期跳过，非数据缺口。
      - name: Data health & alert
        if: always() && steps.freshness.outputs.skip != 'true' && steps.snapshot.outputs.exitcode != '3'
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          TARGET_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.date || 'auto' }}
        run: |
          python tools/alert/data_health.py \
            --mode close-snapshot \
            --date "$TARGET_DATE"
