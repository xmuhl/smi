name: manual-backfill

on:
  workflow_dispatch:
    inputs:
      date:
        description: "目标交易日 YYYY-MM-DD"
        required: true
        type: string
      force:
        description: "重新执行可用数据源"
        required: false
        default: false
        type: boolean
      deploy:
        description: "无数据变化也强制构建并部署（deploy 失败恢复用）"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: smi-data-write-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record job start (UTC)
        run: echo "JOB_START_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r collector/requirements.txt

      - name: Python syntax preflight
        run: |
          python -m compileall -q collector

      - name: Run manual backfill
        env:
          SMI_WORKFLOW: manual-backfill
          TARGET_DATE: ${{ inputs.date }}
          FORCE_BACKFILL: ${{ inputs.force }}
        run: |
          args=(--date "$TARGET_DATE")

          if [[ "$FORCE_BACKFILL" == "true" ]]; then
            args+=(--force)
          fi

          python -m collector.jobs.manual_backfill \
            "${args[@]}"

      - name: Reconcile turnover dependency chain
        env:
          SMI_WORKFLOW: manual-backfill
        run: |
          python -m collector.jobs.reconcile_turnover_chain

      - name: Commit data if changed
        id: commit
        env:
          TARGET_DATE: ${{ inputs.date }}
        run: |
          git config user.name "smi-bot"
          git config user.email "smi-bot@users.noreply.github.com"

          git add web/public/data

          if git diff --cached --quiet; then
            echo "NO_CHANGE"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "data: manual backfill $TARGET_DATE"
          git pull --rebase
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # ===== 方案 A：数据变化才构建并发布 =====
      - name: Setup Node
        if: steps.commit.outputs.changed == 'true' || inputs.deploy
        uses: actions/setup-node@v4
        with:
          # wrangler 4.122.0 要求 Node >= 22（R12-FIX-1）
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        if: steps.commit.outputs.changed == 'true' || inputs.deploy
        working-directory: web
        run: npm ci

      - name: Type check
        if: steps.commit.outputs.changed == 'true' || inputs.deploy
        working-directory: web
        run: npm run typecheck

      - name: Build
        if: steps.commit.outputs.changed == 'true' || inputs.deploy
        working-directory: web
        run: npm run build

      - name: Deploy to Cloudflare Pages
        if: steps.commit.outputs.changed == 'true' || inputs.deploy
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy dist \
            --project-name smi \
            --branch main \
            --commit-dirty=true

      # R12-FIX-4：部署后自检（口径同 close-snapshot）
      - name: Verify deployment freshness
        # 复核修订：NO_CHANGE/强制部署时 latest.json 不更新，避免假失败；
        # 仅数据变化（changed=true）的发布才做新鲜度断言
        if: steps.commit.outputs.changed == 'true'
        run: |
          SITE="https://smi-6s2.pages.dev/data/latest.json"
          for attempt in 1 2 3 4 5 6; do
            sleep 30
            META=$(curl -fsS --max-time 20 "$SITE" 2>/dev/null | python3 -c '
          import json, sys
          try:
            d = json.load(sys.stdin)
          except Exception:
            print("")
            raise SystemExit(0)
          print(d.get("updatedAt", "") + "|" + str(d.get("tradeDate", "")))
          ' || echo "")
            UPDATED=$(printf '%s' "$META" | cut -d"|" -f1)
            TRADE_DATE=$(printf '%s' "$META" | cut -d"|" -f2)
            if [ -n "$UPDATED" ]; then
              VERDICT=$(python3 -c '
          import sys
          from datetime import datetime
          def parse(s):
            s = s.strip().replace("Z", "+00:00")
            return datetime.fromisoformat(s)
          print("FRESH" if parse(sys.argv[1]) >= parse(sys.argv[2]) else "STALE")
          ' "$UPDATED" "$JOB_START_UTC")
              echo "attempt=$attempt tradeDate=$TRADE_DATE updatedAt=$UPDATED verdict=$VERDICT"
              if [ "$VERDICT" = "FRESH" ]; then
                echo "SITE_FRESH"
                exit 0
              fi
            else
              echo "attempt=$attempt site unreachable or unparsable"
            fi
          done
          echo "SITE_STALE_OR_UNREACHABLE after deploy"
          exit 1
