name: manual-backfill

on:
  workflow_dispatch:
    inputs:
      date:
        description: "目标交易日 YYYY-MM-DD"
        required: true
        type: string
      force:
        description: "重新执行可用数据源"
        required: false
        default: false
        type: boolean
      deploy:
        description: "无数据变化也强制构建并部署（deploy 失败恢复用）"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: smi-data-write-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r collector/requirements.txt

      - name: Python syntax preflight
        run: |
          python -m compileall -q collector

      - name: Run manual backfill
        env:
          SMI_WORKFLOW: manual-backfill
          TARGET_DATE: ${{ inputs.date }}
          FORCE_BACKFILL: ${{ inputs.force }}
        run: |
          args=(--date "$TARGET_DATE")

          if [[ "$FORCE_BACKFILL" == "true" ]]; then
            args+=(--force)
          fi

          python -m collector.jobs.manual_backfill \
            "${args[@]}"

      - name: Reconcile turnover dependency chain
        env:
          SMI_WORKFLOW: manual-backfill
        run: |
          python -m collector.jobs.reconcile_turnover_chain

      - name: Commit data if changed
        id: commit
        env:
          TARGET_DATE: ${{ inputs.date }}
        run: |
          git config user.name "smi-bot"
          git config user.email "smi-bot@users.noreply.github.com"

          git add web/public/data

          if git diff --cached --quiet; then
            echo "NO_CHANGE"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "data: manual backfill $TARGET_DATE"
          git pull --rebase
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # ===== 方案 A：数据变化才构建并发布 =====
      - name: Setup Node
        if: steps.commit.outputs.changed == 'true' || inputs.deploy
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        if: steps.commit.outputs.changed == 'true' || inputs.deploy
        working-directory: web
        run: npm ci

      - name: Type check
        if: steps.commit.outputs.changed == 'true' || inputs.deploy
        working-directory: web
        run: npm run typecheck

      - name: Build
        if: steps.commit.outputs.changed == 'true' || inputs.deploy
        working-directory: web
        run: npm run build

      - name: Deploy to Cloudflare Pages
        if: steps.commit.outputs.changed == 'true' || inputs.deploy
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy dist \
            --project-name smi \
            --branch main \
            --commit-dirty=true
