name: freshness-watchdog

on:
  schedule:
    # 2026-08-27 事故：close-snapshot 三个 cron 窗口（16:23/18:23/19:23
    # CST）被 GitHub 调度整体丢弃，"未触发"不产生失败运行 → 全天静默
    # 停更，20:19 手动 dispatch 才恢复。本工作流为兜底巡检 + 自动恢复：
    # 盘后 17:10/18:10/19:10/20:10 CST 检查当日 latest.json 是否发布，
    # 滞后即自动 dispatch close-snapshot + 告警；次日 10:40 CST 检查
    # 上一交易日是否整体缺失，缺失即自动 dispatch manual-backfill 回补。
    - cron: "10 9 * * 1-5"
    - cron: "10 10 * * 1-5"
    - cron: "10 11 * * 1-5"
    - cron: "10 12 * * 1-5"
    - cron: "40 2 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "today=盘后当日巡检 / catchup=次晨缺口巡检"
        required: false
        default: "today"
        type: choice
        options:
          - today
          - catchup

# actions:write 仅为通过 API dispatch 其他 workflow；
# 本工作流自身不写仓库、不占用 smi-data-write 串行组。
permissions:
  contents: read
  actions: write

concurrency:
  group: smi-freshness-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r collector/requirements.txt

      - name: Freshness check & auto-recover
        env:
          # dispatch 其他 workflow 需要 actions: write 的运行时令牌
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python tools/alert/freshness_watchdog.py \
            --mode "${{ inputs.mode || 'today' }}"
